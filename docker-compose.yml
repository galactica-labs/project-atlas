services:
  atlas-postgres:
    image: postgres:18-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_imports
      POSTGRES_PASSWORD: atlas
      POSTGRES_USER: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_imports"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atlas-postgres-data:
